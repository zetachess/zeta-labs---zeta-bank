services:
  zetabank:
    build: .
    container_name: zetabank
    # Solo accesible desde tu propio equipo (nunca expuesto a la red)
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    restart: "no"
